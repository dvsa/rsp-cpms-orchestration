service: rsp-cpms-orchestration

custom:
  documentation:
    version: '1'
    title: 'RSP CPMS Orchestration API'
    description: 'Api to handle and orchestrate calls to CPMS from RSP'
    models:
      - name: CardPaymentRequest
        contentType: application/json
        schema: ${file(../src/models/CardPaymentRequest.json)}
      - name: GroupCardPaymentRequest
        contentType: application/json
        schema:
          type: object
          additionalProperties: true
          description: Group transaction; fields are validated by the existing group payment validator.
          example: ${file(../src/models/CardGroupPaymentRequest.json)}
      - name: CashPaymentRequest
        contentType: application/json
        schema: ${file(../src/models/CashPaymentRequest.json)}
      - name: ChequePaymentRequest
        contentType: application/json
        schema: ${file(../src/models/ChequePaymentRequest.json)}
      - name: PostalOrderPaymentRequest
        contentType: application/json
        schema: ${file(../src/models/PostalOrderPaymentRequest.json)}
      - name: ConfirmRequest
        contentType: application/json
        schema: ${file(../src/models/ConfirmRequest.json)}
      - name: PaymentResponse
        contentType: application/json
        schema:
          description: CPMS response passed through unchanged; fields depend on payment method and state.
      - name: ErrorResponse
        contentType: application/json
        schema:
          description: Existing error response; may be an object or a string depending on the operation.
plugins:
  - serverless-offline
  - serverless-openapi-documenter
provider:
  name: aws
  runtime: nodejs24.x
  region: eu-west-1
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "sqs:SendMessage"
        - "sqs:ReceiveMessage"
        - "sqs:DeleteMessage"
        - "sqs:GetQueueAttributes"
      Resource: arn:aws:sqs:#{AWS::Region}:#{AWS::AccountId}:CPMS_Launched_Payments
functions:
  cardPayment:
    handler: cardPayment/app.handler
    memorySize: 128
    events:
      -
        http:
          path: cardPayment
          method: post
          authorizer: aws_iam
          cors: true
          documentation:
            summary: "Create card payment"
            description: "Create card payment transaction and return payment URL"
            requestBody:
              description: "None"
            requestModels:
              application/json: "CardPaymentRequest"
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: "Body containing Transaction ID and payment URL"
                responseModels:
                  application/json: "PaymentResponse"
              - statusCode: 400
                responseBody:
                  description: "Error message detailing why the transaction could not be created"
                responseModels:
                  application/json: "ErrorResponse"
  groupPayment:
    handler: groupPayment/app.handler
    memorySize: 128
    events:
      -
        http:
          path: groupPayment
          method: post
          authorizer: aws_iam
          cors: true
          # TODO: Update this
          documentation:
            summary: "Create group payment"
            description: "Create group payment transaction and return payment URL"
            requestBody:
              description: "None"
            requestModels:
              application/json: "GroupCardPaymentRequest"
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: "Body containing Transaction ID and payment URL"
                responseModels:
                  application/json: "PaymentResponse"
              - statusCode: 400
                responseBody:
                  description: "Error message detailing why the transaction could not be created"
                responseModels:
                  application/json: "ErrorResponse"
  cardNotPresentPayment:
    handler: cardNotPresentPayment/app.handler
    memorySize: 128
    events:
      -
        http:
          path: cardNotPresentPayment
          method: post
          authorizer: aws_iam
          cors: true
          documentation:
            summary: "Create Card Holder Not Present Payment"
