            methodResponses:
              - statusCode: 200
                responseBody:
                  description: "Body containing TransactionID and payment URL"
                responseModels:
                  application/json: "PaymentResponse"
              - statusCode: 400
                responseBody:
                  description: "Error message detailing why the transaction could not be created"
                responseModels:
